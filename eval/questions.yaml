    sources: [decp]
    answer_type: set
    expected: ["18002002600019", "82454114800014", "43276694700019"]
    as_of: "2026-11-20"
    note: "243, 143, 123 contracts (first two: Caisse des Depots et Consignations, Action Logement Services per recherche-entreprises)."
    gold_calls:
      - tool: rank_decp_parties
        args: {by: buyer, order: count, cpv_prefix: "72", notified_from: "2025-01-01", notified_to: "2025-12-31", top: 3}
    extract: entries[*].siret
    verification: "GET DECP?limit=3&select=acheteur_id, count(*) as n&group_by=acheteur_id&order_by=n desc&where=startswith(codecpv,'72') AND datenotification>=date'2025-01-01' AND datenotification<=date'2025-12-31'"
  - id: decp-03
    question: "En Haute-Garonne (31), quel acheteur (donne son SIRET) a notifié le plus de marchés de services informatiques (CPV commençant par 72) en 2025 ?"
