  # ------------------------------------------------------------------ DECP (8)
  - id: decp-01
    question: "Quel fournisseur (donne son SIRET) a remporté le plus grand nombre de marchés notifiés en 2025 dans les services informatiques (CPV commençant par 72), en France ?"
    sources: [decp]
    answer_type: exact
    expected: "30516304000119"
    as_of: "2026-11-20"
    note: "69 contracts; the company is CIRIL GROUP per recherche-entreprises. Ranking uses titulaire_id_1 only."
    gold_calls:
      - tool: rank_decp_parties
        args: {by: supplier, order: count, cpv_prefix: "72", notified_from: "2025-01-01", notified_to: "2025-12-31", top: 5}
    extract: entries[0].siret
    verification: "GET DECP?limit=5&select=titulaire_id_1, count(*) as n&group_by=titulaire_id_1&order_by=n desc&where=startswith(codecpv,'72') AND titulaire_id_1!='CDL' AND datenotification>=date'2025-01-01' AND datenotification<=date'2025-12-31' -> 30516304000119 (n=69), 34054699300684 (57), 34503941600085 (51)"
  - id: decp-02
