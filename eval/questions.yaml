    verification: "GET BOAMP?limit=0&where=nature='APPEL_OFFRE' AND dateparution>=date'2026-10-01' AND dateparution<=date'2026-10-31' AND code_departement IN ('9','11','12','30','31','32','34','46','48','65','66','81','82') -> total_count=728"
