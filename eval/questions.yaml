# Evaluation questions for mcp-marches-publics.
# Ground truths computed on 2026-11-20 by querying the official APIs directly (urllib, ODSQL /
# TED expert query), independently of the project code. See PREREGISTRATION.md.
#
# `extract`: where the oracle reads the answer. A string = path in the LAST gold call result
# (optionally "N:path" to pick gold call N, 0-based); a list = several paths (joined for
# `contains`); a dict = named values (composite answers). Syntax: a.b[0].c / list[*].key.
# Bases: BOAMP = https://boamp-datadila.opendatasoft.com/api/explore/v2.1/catalog/datasets/boamp/records
#        DECP  = https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/decp-2022-marches-valides/records
#        TED   = POST https://api.ted.europa.eu/v3/notices/search (anonymous, scope ALL)
#        ENT   = https://recherche-entreprises.api.gouv.fr/search?q=<siret>&page=1&per_page=1
questions:
  # ------------------------------------------------------------------ BOAMP (8)
  - id: boamp-01
    question: "Combien d'avis d'appel d'offres ont été publiés au BOAMP en octobre 2026 et diffusés en Haute-Garonne (31) ?"
    sources: [boamp]
    answer_type: number_tolerance
    expected: 220
    tolerance_pct: 3
    as_of: "2026-11-20"
    gold_calls:
      - tool: search_boamp_notices
        args: {departments: ["31"], published_from: "2026-10-01", published_to: "2026-10-31", notice_kind: tender, limit: 1}
    extract: page.total
    verification: "GET BOAMP?limit=0&where=nature='APPEL_OFFRE' AND dateparution>=date'2026-10-01' AND dateparution<=date'2026-10-31' AND code_departement='31' -> total_count=220"
