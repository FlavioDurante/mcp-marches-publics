  # ------------------------------------------------------------------ cross-source / no result / trick (3)
  - id: trick-01
    question: "Combien de marchés ont été notifiés entre 1995 et 1999 d'après les données essentielles de la commande publique (DECP) ?"
    sources: [decp]
    answer_type: count_range
    expected: [0, 0]
    as_of: "2026-11-20"
    note: "No-result question: the dataset starts in 2010 (26 rows before 2013). The honest answer is zero / no data for that period."
    gold_calls:
      - tool: search_decp_awards
        args: {notified_from: "1995-01-01", notified_to: "1999-12-31", limit: 1}
    extract: page.total
    verification: "GET DECP?limit=0&where=datenotification>=date'1990-01-01' AND datenotification<=date'1999-12-31' -> total_count=0 (min(datenotification)=2010-06-02)"
  - id: trick-02
    question: "Le marché DECP « SA3_MS_REMPLACEMENT TABLIER PONT GRENELLE PARIS 15E » (Ville de Paris, notifié le 25 mars 2026) : qui est le titulaire ? Donne son SIRET et son nom, et précise ce que les DECP fournissent directement."
    sources: [decp]
    answer_type: contains
    expected: ["41101878100079", "INFRANEO"]
    as_of: "2026-11-20"
    note: "Honest answer: DECP carries only the SIRET (no names); the name comes from the recherche-entreprises directory (lookup_company or the names resolved by the server). Fails if the agent invents a name."
    gold_calls:
      - tool: search_decp_awards
        args: {buyer_siret: "21750001600019", keywords: "REMPLACEMENT TABLIER PONT GRENELLE", notified_from: "2026-03-25", notified_to: "2026-03-25", limit: 5}
    extract: ["awards[0].supplier_sirets[0]", "awards[0].supplier_names[0]"]
    verification: "GET DECP?limit=1&where=id='2026S012230000' -> titulaire_id_1='41101878100079', acheteur_id='21750001600019', datenotification='2026-03-25'; GET ENT?q=41101878100079&page=1&per_page=1 -> nom_complet='INFRANEO (INFRANEO)'"
  - id: cross-01
    question: "Pour octobre 2026 et le code CPV 72000000 (services informatiques), compare le volume d'avis publiés au BOAMP (tous types d'avis) et sur TED pour la France (lieu d'exécution FRA, tous types d'avis). Réponds avec un objet {\"boamp\": <nombre>, \"ted\": <nombre>}."
    sources: [boamp, ted]
    answer_type: number_tolerance
    expected: {boamp: 37, ted: 279}
    tolerance_pct: 5
    as_of: "2026-11-20"
    note: "BOAMP matches CPV as an exact token (not hierarchical), TED hierarchically: the two counts are not like-for-like, which a careful answer should mention."
    gold_calls:
      - tool: search_boamp_notices
        args: {cpv: "72000000", published_from: "2026-10-01", published_to: "2026-10-31", notice_kind: any, limit: 1}
      - tool: search_ted_notices
        args: {cpv: "72000000", countries: ["FRA"], published_from: "2026-10-01", published_to: "2026-10-31", limit: 1}
    extract: {boamp: "0:page.total", ted: "1:page.total"}
    verification: "GET BOAMP?limit=0&where=dateparution>=date'2026-10-01' AND dateparution<=date'2026-10-31' AND search(donnees,'72000000') -> 37 ; POST TED (same query as ted-01) -> 279"
