        args: {by: buyer, order: amount, cpv_prefix: "71", notified_from: "2025-01-01", notified_to: "2025-12-31", top: 3}
    extract: entries[0].siret
    verification: "GET DECP?limit=3&select=acheteur_id, sum(montant) as s, count(*) as n&group_by=acheteur_id&order_by=s desc&where=startswith(codecpv,'71') AND datenotification>=date'2025-01-01' AND datenotification<=date'2025-12-31' -> 21060079700182 (1005394510.0), 20009320100016 (611056067.24), 26060070500040 (565768642.0)"
  - id: decp-08
