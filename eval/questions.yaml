        args: {by: buyer, order: count, cpv_prefix: "72", department: "31", notified_from: "2025-01-01", notified_to: "2025-12-31", top: 3}
    extract: entries[0].siret
    verification: "GET DECP?limit=3&select=acheteur_id, count(*) as n&group_by=acheteur_id&order_by=n desc&where=((lieuexecution_typecode='Code département' AND lieuexecution_code='31') OR (lieuexecution_typecode='Code postal' AND startswith(lieuexecution_code,'31'))) AND startswith(codecpv,'72') AND datenotification>=date'2025-01-01' AND datenotification<=date'2025-12-31' -> 18008901307994 (64), 24310051800170 (24), 20005379100014 (16)"
