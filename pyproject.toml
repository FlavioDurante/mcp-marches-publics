[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcp-marches-publics"
version = "0.1.0"
description = "MCP server for French and EU public procurement open data (BOAMP, DECP, TED)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Flavio Durante" }]
keywords = ["mcp", "public-procurement", "boamp", "decp", "ted", "open-data", "llm", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Intended Audience :: Developers",
]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "black>=24", "ruff>=0.6", "pyyaml>=6"]
eval = ["pyyaml>=6"]

[project.scripts]
mcp-marches-publics = "marches_publics_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/marches_publics_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: hits the real public APIs (disabled by default, run with -m integration)"]
addopts = "-m 'not integration'"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
